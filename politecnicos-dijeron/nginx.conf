# Se procesa como plantilla: ${PORT} se sustituye al arrancar el contenedor.
server {
  listen ${PORT};
  listen [::]:${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA: cualquier ruta (/board, /presenter, ...) cae en index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Bundles con hash de contenido: caché larga
  location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El index nunca se cachea para que los despliegues se reflejen al instante
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}